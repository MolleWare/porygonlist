# DRAFT of the F-Droid metadata, kept here so it is versioned with the app. What goes in the merge
# request to https://gitlab.com/fdroid/fdroiddata, as metadata/io.github.molleware.porygonlist.yml,
# is everything from "Categories:" down; this header block stays here.
#
# Checked with fdroidserver 2.4.5: `fdroid lint` passes with our real signing key (2026-10-10),
# "Shopping List" is in fdroiddata's config/categories.yml, and the field order below is what
# `fdroid rewritemeta` produces (comments aside). The build server's default JDK is 21, which the
# build needs: ./scripts/fdroid-check.sh built in F-Droid's image with no extra step (2026-10-10).
#
# AllowedAPKSigningKeys is our release certificate's SHA-256, lowercase without colons, as
# `./scripts/build.sh signing` prints it (2026-10-09).
#
# Before submitting: attach our signed APK to the GitHub release under the name in Binaries.

Categories:
  - Shopping List
License: GPL-3.0-or-later
AuthorName: MolleWare
SourceCode: https://github.com/MolleWare/porygonlist
IssueTracker: https://github.com/MolleWare/porygonlist/issues

AutoName: PorygonList

RepoType: git
Repo: https://github.com/MolleWare/porygonlist.git

# Reproducible builds: F-Droid builds from source, checks its build matches our signed APK, and
# then publishes ours — so the signature is the same as the Play Store's and either can update the
# other.
Binaries: https://github.com/MolleWare/porygonlist/releases/download/v%v/porygonlist-%v.apk

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: v0.1.0
    subdir: app
    gradle:
      - yes

